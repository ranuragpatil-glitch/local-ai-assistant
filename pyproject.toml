[project]
name = "local-ai-assistant"
version = "0.3.0"
description = "Personal developer assistant for local LLMs: web/GitHub/PyPI research, local notes, long-term memory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.14",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "ollama>=0.6.3",
    "python-dotenv>=1.0",
    "indic-transliteration>=2.3",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
local-ai-assistant = "local_ai_assistant.server:main"
local-ai-chat      = "local_ai_assistant.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
